<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="312" viewBox="0 0 1200 312" role="img" aria-labelledby="title">
  <title id="title">Ali Safarpour, frontend engineer</title>
  <style>
    .half { transform-box: fill-box; transform-origin: center; }
    .left { --offset: -20px; --turn: -26deg; }
    .right { --offset: 20px; --turn: 26deg; }

    @media (prefers-reduced-motion: no-preference) {
      .half { animation: settle 1.45s cubic-bezier(.22,.75,.22,1) .12s backwards; }
      .right { animation-delay: .20s; }
      .underside { animation: lower-case 1.45s ease-out .12s backwards; }
      .right .underside { animation-delay: .20s; }
    }

    @keyframes settle {
      from { transform: perspective(720px) translate(var(--offset), -16px) rotateX(48deg) rotateY(var(--turn)); }
      to   { transform: perspective(720px) translate(0, 0) rotateX(0deg) rotateY(0deg); }
    }
    @keyframes lower-case {
      from { transform: translateY(17px); }
      to   { transform: translateY(5px); }
    }
  </style>
  <defs>
