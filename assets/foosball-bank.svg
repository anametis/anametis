<svg xmlns="http://www.w3.org/2000/svg" width="570" height="244" viewBox="0 0 570 244" role="img" aria-labelledby="title desc">
  <title id="title">A bank shot into the net</title>
  <desc id="desc">The ball rebounds off the top rail, clears the keeper, and rolls into the goal.</desc>
  <style>
    .ball { transform: translate(534px, 143px); }
    @media (prefers-reduced-motion: no-preference) {
      .ball { animation: replay 4s linear infinite; }
      @keyframes replay {
        0%, 15% { transform: translate(110px, 159px); }
        47% { transform: translate(337px, 33px); }
        71%, 100% { transform: translate(534px, 143px); }
      }
    }
  </style>
  <defs>
    <pattern id="net" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0H7V7" fill="none" stroke="#a4c3af" stroke-width="1"/>
    </pattern>
    <g id="rod">
      <rect x="-5" y="20" width="10" height="204" fill="#223f39" opacity=".28"/>
      <rect x="-3" y="9" width="6" height="223" rx="3" fill="#b7b2c9"/>
      <path d="M-1 12v216" stroke="#f3f0fb" stroke-width="1.5"/>
      <rect x="-8" y="12" width="16" height="10" rx="3" fill="#554d69"/>
      <rect x="-8" y="223" width="16" height="10" rx="3" fill="#554d69"/>
    </g>
    <g id="player">
      <rect x="-12" y="-12" width="34" height="27" rx="7" fill="#133f3e" opacity=".45"/>
      <path d="M-17-7h12v14h-12q-3-7 0-14Z" fill="#beb6f3" stroke="#453d68" stroke-width="2"/>
      <rect x="-7" y="-15" width="19" height="30" rx="7" fill="#9588dc" stroke="#453d68" stroke-width="2"/>
      <path d="M-2-12v24" stroke="#d6d1ff" stroke-width="3"/>
      <circle cx="14" cy="0" r="8" fill="#eeeaff" stroke="#453d68" stroke-width="2"/>
    </g>
  </defs>
  <rect x="1" y="6" width="568" height="237" rx="19" fill="#625876"/>
  <rect x="1" y="1" width="568" height="237" rx="19" fill="#c6bedc" stroke="#615774" stroke-width="2"/>
  <rect x="13" y="16" width="544" height="212" rx="10" fill="#423a53"/>
  <rect x="24" y="25" width="497" height="194" rx="5" fill="#256854"/>
  <path d="M27 32h492v180H27z M57 32v180 M520 65h-68v113h68" fill="none" stroke="#b0d7ae" stroke-width="2" opacity=".65"/>
  <path d="M57 85a37 37 0 0 1 0 74" fill="none" stroke="#b0d7ae" stroke-width="2" opacity=".65"/>
  <path d="M520 72h26v100h-26" fill="#204c40" stroke="#d9e6c9" stroke-width="2"/>
  <path d="M521 73h24v98h-24z" fill="url(#net)"/>
  <path fill="none" stroke="#f6e7bf" stroke-width="2.6" stroke-dasharray="4 6" stroke-linecap="round" d="M110 159 337 33 534 143"/>
  <use href="#rod" x="285"/><use href="#rod" x="459"/>
  <use href="#player" x="285" y="127"/><use href="#player" x="459" y="159"/>
  <g class="ball">
    <circle cx="2" cy="4" r="10" fill="#153e35" opacity=".55"/>
    <circle r="9.5" fill="#fff7e6" stroke="#554857" stroke-width="1.5"/>
    <path d="m-1-5 5 2-1 5-5 1-2-4Z" fill="#554857"/>
  </g>
  <g fill="#81778f"><circle cx="12" cy="12" r="2"/><circle cx="558" cy="12" r="2"/><circle cx="12" cy="226" r="2"/><circle cx="558" cy="226" r="2"/></g>
</svg>
